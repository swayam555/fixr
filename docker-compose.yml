name: fixr

x-svc: &svc
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces

x-go: &go
  <<: *svc
  mem_limit: 64m
  environment: &goenv
    <<: *otel
    REDIS_ADDR: redis:6379
    KAFKA_BOOTSTRAP: kafka:9092
    JWKS_URL: http://order-service:8080/.well-known/jwks.json
    LOG_LEVEL: info
  depends_on: &godeps
    redis: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD", "/app", "-healthcheck"]
    interval: 5s
    retries: 20

services:
  init:
    image: alpine/openssl:3.5.9
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./infra/init/init.sh:/init.sh:ro
      - ./infra/generated:/out
    restart: "no"

  postgres:
    <<: *svc
    image: postgis/postgis:18-3.7-alpine
    environment:
      POSTGRES_DB: fixr
      POSTGRES_USER: fixr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fixr}
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=120", "-c", "wal_level=logical"]
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixr -d fixr"]
      interval: 3s
      retries: 30

  redis:
    <<: *svc
    image: redis:8.8.4-alpine
    command: ["redis-server", "--maxmemory", "160mb", "--maxmemory-policy", "volatile-lru", "--notify-keyspace-events", "Ex", "--save", ""]
    ports: ["6379:6379"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  kafka:
    <<: *svc
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx384m -Xms384m
      KAFKA_LOG_RETENTION_HOURS: 24
    ports: ["29092:29092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.4.0
    entrypoint: ["/bin/bash", "/topics.sh"]
    volumes: ["./infra/kafka/topics.sh:/topics.sh:ro"]
    environment: { KAFKA_HEAP_OPTS: -Xmx128m }
    depends_on: { kafka: { condition: service_healthy } }
    restart: "no"

  minio:
    <<: *svc
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fixr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fixr-minio-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    mem_limit: 192m

  order-service:
    <<: *svc
    build: ./services/order-service
    image: fixr/order-service:dev
    deploy: { replicas: 2 }
    environment:
      <<: *otel
      DB_URL: jdbc:postgresql://postgres:5432/fixr
      DB_PASSWORD: ${DB_PASSWORD:-fixr}
      DB_POOL: 10
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:-dev-only-otp-secret-change-me}
      FIXR_DEV_OTP: ${FIXR_DEV_OTP:-true}
      LOG_FORMAT: ecs
      TRACE_SAMPLING: ${TRACE_SAMPLING:-0.2}
    volumes: ["./infra/generated/keys:/keys:ro"]
    mem_limit: 448m
    depends_on:
      init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 5s
      start_period: 40s
      retries: 30

  location-ingest:
    <<: *go
    build: { context: ./services/go, args: { SVC: location-ingest } }
    image: fixr/location-ingest:dev
    deploy: { replicas: 2 }
    environment: { <<: *goenv, ADDR: ":8091" }

  location-processor:
    <<: *go
    build: { context: ./services/go, args: { SVC: location-processor, CGO: "1" } }
    image: fixr/location-processor:dev
    environment: { <<: *goenv, ADDR: ":8094" }

  dispatch-service:
    <<: *go
    build: { context: ./services/go, args: { SVC: dispatch-service } }
    image: fixr/dispatch-service:dev
    deploy: { replicas: 2 }
    environment: { <<: *goenv, ADDR: ":8092", ETA_URL: http://ai-service:8000/ai/eta }

  realtime-gateway:
    <<: *go
    build: { context: ./services/go, args: { SVC: realtime-gateway } }
    image: fixr/realtime-gateway:dev
    deploy: { replicas: 2 }
    environment: { <<: *goenv, ADDR: ":8090", WS_ORIGINS: "localhost:*,127.0.0.1:*,10.0.2.2:*" }

  notifier:
    <<: *go
    build: { context: ./services/go, args: { SVC: notifier } }
    image: fixr/notifier:dev
    environment: { <<: *goenv, ADDR: ":8095" }

  payments-service:
    <<: *go
    build: { context: ./services/go, args: { SVC: payments-service } }
    image: fixr/payments-service:dev
    deploy: { replicas: 2 }
    environment:
      <<: *goenv
      ADDR: ":8093"
      DATABASE_URL: postgres://fixr:${DB_PASSWORD:-fixr}@postgres:5432/fixr?pool_max_conns=6
      RAZORPAY_BASE: ${RAZORPAY_BASE:-http://razorpay-local:8097}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_local}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-local-key-secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-local-webhook-secret}
    depends_on:
      <<: *godeps
      postgres: { condition: service_healthy }

  razorpay-local:
    <<: *go
    build: { context: ./services/go, args: { SVC: razorpay-local } }
    image: fixr/razorpay-local:dev
    ports: ["8097:8097"]
    environment:
      ADDR: ":8097"
      WEBHOOK_URL: http://nginx/pay/webhook
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-local-key-secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-local-webhook-secret}
      DUPLICATE_WEBHOOKS: ${DUPLICATE_WEBHOOKS:-true}
    depends_on: {}

  nginx:
    <<: *svc
    image: nginx:1.30.6-alpine
    ports: ["8080:80", "8443:443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/fixr-locations.conf.inc:/etc/nginx/fixr-locations.conf.inc:ro
      - ./infra/nginx/fixr-routes.conf.inc:/etc/nginx/fixr-routes.conf.inc:ro
      - ./infra/generated/certs:/certs:ro
    mem_limit: 48m
    depends_on:
      init: { condition: service_completed_successfully }

volumes:
  pgdata:
  kafkadata:
  miniodata:
