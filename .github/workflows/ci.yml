name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  order-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/order-service } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B verify

  go-services:
    if: ${{ hashFiles('services/go/go.mod') != '' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/go } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: services/go/go.mod, cache-dependency-path: services/go/go.sum }
      - run: go vet ./...
      - run: go test -race ./...

  ai-service:
    if: ${{ hashFiles('services/ai-service/pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ai-service } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
