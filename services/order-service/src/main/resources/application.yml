spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fixr}
    username: ${DB_USER:fixr}
    password: ${DB_PASSWORD:fixr}
    hikari:
      maximum-pool-size: ${DB_POOL:12}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: ${TRACE_SAMPLING:1.0}
  opentelemetry.tracing.export.otlp.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp.metrics.export.enabled: false

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

fixr:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:../../infra/keys/jwt-private.pem}
    issuer: ${JWT_ISSUER:https://fixr.local}
    access-ttl: PT15M
    refresh-ttl: P30D
  otp:
    secret: ${OTP_HMAC_SECRET:dev-only-otp-secret-change-me}
    ttl: PT5M
    resend-after: PT30S
    max-attempts: 5
    per-phone-limit: 5
    per-phone-window: PT15M
    dev-echo: ${FIXR_DEV_OTP:false}
