worker_processes auto;
events { worker_connections 4096; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$uri","s":$status,'
                              '"rt":$request_time,"ut":"$upstream_response_time","up":"$upstream_addr","rid":"$request_id"}';
  access_log /dev/stdout json;
  client_max_body_size 12m;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=otp:10m rate=6r/m;
  limit_req_zone $binary_remote_addr zone=loc:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=40r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream order_service {
    zone order_service 64k;
    server order-service:8080 resolve;
    keepalive 32;
  }
  upstream realtime_gateway {
    zone realtime_gateway 64k;
    server realtime-gateway:8090 resolve;
  }
  upstream location_ingest {
    zone location_ingest 64k;
    server location-ingest:8091 resolve;
    keepalive 16;
  }
  upstream dispatch_service {
    zone dispatch_service 64k;
    server dispatch-service:8092 resolve;
  }
  upstream payments_service {
    zone payments_service 64k;
    server payments-service:8093 resolve;
  }
  upstream ai_service {
    zone ai_service 64k;
    server ai-service:8000 resolve;
  }

  include /etc/nginx/fixr-locations.conf.inc;

  server {
    listen 80;
    include /etc/nginx/fixr-routes.conf.inc;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /certs/server.pem;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/fixr-routes.conf.inc;
  }
}
